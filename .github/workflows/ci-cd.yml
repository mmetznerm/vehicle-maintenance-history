name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Run unit tests and coverage check
        working-directory: backend
        run: ./mvnw -B verify

  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Run integration tests
        working-directory: backend
        run: ./mvnw -B verify -Pintegration-tests

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests and coverage check
        working-directory: frontend
        run: npm run test:coverage

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  publish-docker-image:
    name: Publish Docker Image to Docker Hub and ECR
    needs:
      - backend-unit-tests
      - backend-integration-tests
      - frontend-quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-publish-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Generate Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            mmetznerm/vehicle-maintenance-history
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ec2:
    name: Deploy to EC2 through SSM
    needs: publish-docker-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-deploy-${{ github.run_id }}

      - name: Set image reference
        id: image
        shell: bash
        run: |
          echo "image_uri=${{ needs.publish-docker-image.outputs.ecr_registry }}/${{ vars.ECR_REPOSITORY }}" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Send deployment command
        id: send-command
        shell: bash
        run: |
          command="/opt/vehicle-maintenance-history/deploy.sh '${{ steps.image.outputs.image_uri }}' '${{ steps.image.outputs.image_tag }}'"
          parameters="$(jq -cn --arg command "$command" '{commands: [$command]}')"
          command_id="$(aws ssm send-command \
            --region '${{ vars.AWS_REGION }}' \
            --instance-ids '${{ vars.EC2_INSTANCE_ID }}' \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${{ steps.image.outputs.image_tag }}" \
            --parameters "$parameters" \
            --query Command.CommandId \
            --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment command
        id: wait-for-command
        continue-on-error: true
        shell: bash
        run: |
          set +e
          aws ssm wait command-executed \
            --region '${{ vars.AWS_REGION }}' \
            --command-id '${{ steps.send-command.outputs.command_id }}' \
            --instance-id '${{ vars.EC2_INSTANCE_ID }}'
          wait_exit_code=$?
          echo "exit_code=$wait_exit_code" >> "$GITHUB_OUTPUT"
          exit "$wait_exit_code"

      - name: Show deployment command invocation
        if: always()
        shell: bash
        run: |
          aws ssm get-command-invocation \
            --region '${{ vars.AWS_REGION }}' \
            --command-id '${{ steps.send-command.outputs.command_id }}' \
            --instance-id '${{ vars.EC2_INSTANCE_ID }}' \
            --output json || true

      - name: Fail when deployment command did not complete
        if: always()
        shell: bash
        run: |
          [[ '${{ steps.wait-for-command.outputs.exit_code }}' == '0' ]]
